name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main, agent/windows-release]
    paths:
      - "Assets/**"
      - "lib/**"
      - "windows/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/windows-build.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Screen2Story-Windows.zip

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Screen2Story-Windows
          path: Screen2Story-Windows.zip
          if-no-files-found: error
